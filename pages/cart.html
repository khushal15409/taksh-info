<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FFFBEF]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart | TakshAllInOne</title>
    <meta name="description" content="TakshAllInOne - groceries, 15-minute delivery, festive decor, electronics and verified home services in one app.">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="apple-touch-icon" href="../assets/img/favicon.png">

    <!-- Tailwind CSS (CDN) + theme config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="font-sans antialiased text-gray-800 bg-[#FFFBEF] min-h-screen flex flex-col selection:bg-brand-500 selection:text-white" data-root="../" data-page="cart">

    <!-- Header, nav & coming-soon banner are rendered by assets/js/ui.js -->
    <div id="site-header" class="contents"></div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6">

        <h1 class="text-2xl font-extrabold text-gray-900 flex items-center gap-3 mb-5"><i data-lucide="shopping-cart" class="w-7 h-7 text-brand-500"></i><span>Your Shopping Cart</span></h1>
        <div id="cart-tabs" class="flex border-b border-gray-200 gap-6 text-sm font-bold mb-6 overflow-x-auto no-scrollbar"></div>
        <div id="cart-root"></div>
        <section id="cart-recs" class="mt-12"></section>

    </main>

    <!-- Footer is rendered by assets/js/ui.js -->
    <div id="site-footer"></div>

    <!-- Scripts: catalogue -> data -> store -> shared UI -> page logic -->
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/pages/cart.js"></script>
</body>
</html>
