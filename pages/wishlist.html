<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FFFBEF]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | TakshAllInOne</title>
    <meta name="description" content="TakshAllInOne - groceries, 15-minute delivery, festive decor, electronics and verified home services in one app.">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="apple-touch-icon" href="../assets/img/favicon.png">

    <!-- Tailwind CSS (CDN) + theme config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="font-sans antialiased text-gray-800 bg-[#FFFBEF] min-h-screen flex flex-col selection:bg-brand-500 selection:text-white" data-root="../" data-page="wishlist">

    <!-- Header, nav & coming-soon banner are rendered by assets/js/ui.js -->
    <div id="site-header" class="contents"></div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6">

        <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
            <div><h1 class="text-2xl font-extrabold text-gray-900">My Wishlist ❤️</h1><p id="wish-count" class="text-xs text-gray-500 mt-1"></p></div>
            <button id="add-all" class="bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Add all to cart</button>
        </div>
        <div id="wish-root"></div>

    </main>

    <!-- Footer is rendered by assets/js/ui.js -->
    <div id="site-footer"></div>

    <!-- Scripts: catalogue -> data -> store -> shared UI -> page logic -->
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/pages/wishlist.js"></script>
</body>
</html>
